[project]
name = "remediator"
version = "0.1.0"
description = "Fictional vulnerability remediation tool (AI Enablement PoC sandbox)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ANN", "SIM"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
